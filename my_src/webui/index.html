<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mini dsh</title>
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("mini-theme"); } catch (e) { /* 存储不可读则跳过 */ }
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101418; --fg: #d7dde3; --muted: #77828c;
        --border: #232a31; --panel-border: #2a333c; --ctrl-border: #2f3944;
        --panel: #161c22; --panel-2: #131920; --code-bg: #0e1318;
        --btn-bg: #1b232b; --btn-hover: #232d37;
        --hover: #1a222b; --hover-2: #1d2630; --item-border: #20272e;
        --accent: #e0c06a; --section-title: #8b96a0;
        --ok: #43c463; --warn: #e0a63a; --err: #d05b5b; --err-text: #e08a8a;
        --user-bubble: #1d2a3a; --user-border: #2c3d52;
        --dot-base: #566; --dot-idle: #667;
        --approval-bg: #1d1a12; --approval-border: #7a6530;
        --plan-bg: #131a24; --plan-border: #34506e; --tool-err-border: #6b3030;
        --secondary-text: #a7b2bc; --cost-text: #9aa7b1;
        --shadow: 0 8px 24px rgba(0, 0, 0, .45);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f5f7f9; --fg: #1d252d; --muted: #64707b;
        --border: #dde3e8; --panel-border: #d3dae0; --ctrl-border: #c6ced5;
        --panel: #ffffff; --panel-2: #eef1f4; --code-bg: #f0f3f6;
        --btn-bg: #e9edf1; --btn-hover: #dde4ea;
        --hover: #e8edf1; --hover-2: #e2e8ed; --item-border: #e4e9ee;
        --accent: #8a6d00; --section-title: #6d7a85;
        --ok: #1f9d4d; --warn: #c98a10; --err: #cc4b4b; --err-text: #b84848;
        --user-bubble: #e4eefa; --user-border: #bcd6ee;
        --dot-base: #99a5af; --dot-idle: #b6bfc7;
        --approval-bg: #fdf8e7; --approval-border: #bfa04a;
        --plan-bg: #eef4fb; --plan-border: #8fb0d4; --tool-err-border: #d9a0a0;
        --secondary-text: #5c6771; --cost-text: #7a8792;
        --shadow: 0 8px 24px rgba(30, 40, 50, .16);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .mono { font-family: ui-monospace, Consolas, monospace; }
      .muted { color: var(--muted); }
      .app { display: grid; grid-template: "header header" auto "sidebar main" 1fr / 240px 1fr; height: 100vh; }
      header {
        grid-area: header; display: flex; align-items: center; gap: 10px;
        padding: 10px 16px; border-bottom: 1px solid var(--border);
      }
      .theme-toggle { margin-left: auto; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot-base); }
      .dot[data-phase="live"] { background: var(--ok); }
      .dot[data-phase="connecting"], .dot[data-phase="reconnecting"] { background: var(--warn); }
      .dot[data-phase="idle"] { background: var(--dot-idle); }
      .title { font-weight: 600; }
      aside { grid-area: sidebar; padding: 16px; border-right: 1px solid var(--border); }
      aside h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--section-title); }
      .session-card { padding: 10px 12px; border: 1px solid var(--panel-border); border-radius: 8px; background: var(--panel); }
      .projection { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--panel-border); border-radius: 8px; background: var(--panel-2); display: flex; flex-direction: column; gap: 5px; }
      .projection h2 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--section-title); }
      .projection h2 .muted { text-transform: none; letter-spacing: 0; }
      .projection-row { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; overflow-wrap: anywhere; }
      .projection-row[data-active="true"] { color: var(--accent); }
      .toolbar { display: flex; gap: 8px; margin-top: 12px; }
      button {
        padding: 6px 12px; border: 1px solid var(--ctrl-border); border-radius: 6px;
        background: var(--btn-bg); color: var(--fg); cursor: pointer;
      }
      button:hover { background: var(--btn-hover); }
      main { grid-area: main; display: flex; flex-direction: column; }
      .conversation-scroll { flex: 1; overflow-y: auto; padding: 16px 20px; }
      .conversation-empty { height: 100%; display: grid; place-content: center; text-align: center; }
      .conversation { display: flex; flex-direction: column; gap: 10px; max-width: 860px; margin: 0 auto; }
      .bubble { padding: 9px 13px; border-radius: 10px; max-width: 78%; white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble.user { align-self: flex-end; background: var(--user-bubble); border: 1px solid var(--user-border); }
      .bubble.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--panel-border); }
      .prewrap { white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble .usage { margin-top: 6px; font-size: 12px; }
      .injection { align-self: center; max-width: 78%; border: 1px dashed var(--panel-border); border-radius: 8px; padding: 4px 10px; color: var(--muted); font-size: 12px; }
      .injection summary { cursor: pointer; }
      .injection pre { margin: 6px 0 2px; max-height: 220px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
      .turn-divider { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 12px; }
      .turn-divider::before, .turn-divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
      .tool-card { align-self: flex-start; width: 78%; border: 1px solid var(--panel-border); border-radius: 8px; background: var(--panel-2); overflow: hidden; }
      .tool-card[data-status="error"] { border-color: var(--tool-err-border); }
      .tool-head { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 7px 11px; text-align: left; }
      .tool-head:hover { background: var(--hover); }
      .tool-status { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-base); }
      .tool-status[data-status="ok"] { background: var(--ok); }
      .tool-status[data-status="error"] { background: var(--err); }
      .tool-status[data-status="running"] { background: var(--warn); }
      .tool-head .muted { margin-left: auto; font-size: 12px; }
      .tool-body { padding: 2px 11px 10px; }
      .tool-body .muted { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
      .tool-body pre { margin: 3px 0 0; padding: 7px 9px; background: var(--code-bg); border-radius: 6px; max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .tool-body pre[data-error="true"] { color: var(--err-text); }
      .error-line { color: var(--err-text); padding: 2px 0; }
      .error-line.mono { font-size: 12px; }
      .composer-error { padding: 4px 16px 0; font-size: 13px; }
      .narrative-strip { display: flex; flex-direction: column; gap: 2px; padding: 6px 16px 0; max-height: 140px; overflow-y: auto; }
      .narrative-line { font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
      .narrative-line[data-kind="error"] { color: var(--err-text); }
      .narrative-line[data-kind="cost"] { color: var(--cost-text); font-family: ui-monospace, Consolas, monospace; }
      .approval-card {
        margin: 0 16px 8px; padding: 12px 14px; max-width: 860px; align-self: center; width: calc(100% - 32px);
        border: 1px solid var(--approval-border); border-radius: 10px; background: var(--approval-bg);
      }
      .approval-card[data-kind="plan"] { border-color: var(--plan-border); background: var(--plan-bg); }
      .approval-title { font-weight: 600; margin-bottom: 6px; }
      .approval-message { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
      .approval-detail summary { cursor: pointer; margin-bottom: 6px; }
      .approval-detail pre { margin: 4px 0 8px; padding: 7px 9px; background: var(--code-bg); border-radius: 6px; max-height: 180px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .plan-body { margin: 4px 0 10px; padding: 9px 11px; background: var(--code-bg); border-radius: 6px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .approval-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .approval-actions button.secondary { border-color: var(--ctrl-border); color: var(--secondary-text); }
      .approval-feedback { display: flex; flex-direction: column; gap: 8px; }
      .approval-feedback textarea {
        min-height: 64px; padding: 8px 10px; border-radius: 8px; resize: vertical;
        border: 1px solid var(--panel-border); background: var(--panel); color: var(--fg); font: inherit;
      }
      .completion { position: relative; }
      .composer { position: relative; }
      .completion {
        position: absolute; bottom: calc(100% + 6px); left: 16px; z-index: 5;
        display: flex; flex-direction: column; min-width: 380px; max-width: calc(100% - 32px);
        border: 1px solid var(--panel-border); border-radius: 8px; background: var(--panel); overflow: hidden;
        box-shadow: var(--shadow);
      }
      .completion-item { display: flex; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid var(--item-border); border-radius: 0; background: transparent; padding: 7px 12px; text-align: left; }
      .completion-item:last-child { border-bottom: 0; }
      .completion-item:hover { background: var(--hover-2); }
      .completion-item .muted { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .completion-kind { font-size: 11px; color: var(--muted); border: 1px solid var(--panel-border); border-radius: 4px; padding: 1px 6px; }
      .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
      .composer input {
        flex: 1; padding: 9px 12px; border-radius: 8px;
        border: 1px solid var(--panel-border); background: var(--panel); color: var(--fg);
      }
      .composer input:disabled { opacity: .55; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
