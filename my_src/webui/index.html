<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mini dsh</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #101418;
        color: #d7dde3;
      }
      .mono { font-family: ui-monospace, Consolas, monospace; }
      .muted { color: #77828c; }
      .app { display: grid; grid-template: "header header" auto "sidebar main" 1fr / 240px 1fr; height: 100vh; }
      header {
        grid-area: header; display: flex; align-items: center; gap: 10px;
        padding: 10px 16px; border-bottom: 1px solid #232a31;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #566; }
      .dot[data-phase="live"] { background: #43c463; }
      .dot[data-phase="connecting"], .dot[data-phase="reconnecting"] { background: #e0a63a; }
      .dot[data-phase="idle"] { background: #667; }
      .title { font-weight: 600; }
      aside { grid-area: sidebar; padding: 16px; border-right: 1px solid #232a31; }
      aside h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8b96a0; }
      .session-card { padding: 10px 12px; border: 1px solid #2a333c; border-radius: 8px; background: #161c22; }
      .toolbar { display: flex; gap: 8px; margin-top: 12px; }
      button {
        padding: 6px 12px; border: 1px solid #2f3944; border-radius: 6px;
        background: #1b232b; color: #d7dde3; cursor: pointer;
      }
      button:hover { background: #232d37; }
      main { grid-area: main; display: flex; flex-direction: column; }
      .conversation-scroll { flex: 1; overflow-y: auto; padding: 16px 20px; }
      .conversation-empty { height: 100%; display: grid; place-content: center; text-align: center; }
      .conversation { display: flex; flex-direction: column; gap: 10px; max-width: 860px; margin: 0 auto; }
      .bubble { padding: 9px 13px; border-radius: 10px; max-width: 78%; white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble.user { align-self: flex-end; background: #1d2a3a; border: 1px solid #2c3d52; }
      .bubble.assistant { align-self: flex-start; background: #161c22; border: 1px solid #2a333c; }
      .prewrap { white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble .usage { margin-top: 6px; font-size: 12px; }
      .injection { align-self: center; max-width: 78%; border: 1px dashed #333d47; border-radius: 8px; padding: 4px 10px; color: #77828c; font-size: 12px; }
      .injection summary { cursor: pointer; }
      .injection pre { margin: 6px 0 2px; max-height: 220px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
      .turn-divider { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 12px; }
      .turn-divider::before, .turn-divider::after { content: ""; flex: 1; border-top: 1px solid #232a31; }
      .tool-card { align-self: flex-start; width: 78%; border: 1px solid #2a333c; border-radius: 8px; background: #131920; overflow: hidden; }
      .tool-card[data-status="error"] { border-color: #6b3030; }
      .tool-head { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 7px 11px; text-align: left; }
      .tool-head:hover { background: #1a222b; }
      .tool-status { width: 8px; height: 8px; border-radius: 50%; background: #566; }
      .tool-status[data-status="ok"] { background: #43c463; }
      .tool-status[data-status="error"] { background: #d05b5b; }
      .tool-status[data-status="running"] { background: #e0a63a; }
      .tool-head .muted { margin-left: auto; font-size: 12px; }
      .tool-body { padding: 2px 11px 10px; }
      .tool-body .muted { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
      .tool-body pre { margin: 3px 0 0; padding: 7px 9px; background: #0e1318; border-radius: 6px; max-height: 200px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .tool-body pre[data-error="true"] { color: #e08a8a; }
      .error-line { color: #e08a8a; padding: 2px 0; }
      .error-line.mono { font-size: 12px; }
      .composer-error { padding: 4px 16px 0; font-size: 13px; }
      .narrative-strip { display: flex; flex-direction: column; gap: 2px; padding: 6px 16px 0; max-height: 140px; overflow-y: auto; }
      .narrative-line { font-size: 12px; color: #77828c; white-space: pre-wrap; overflow-wrap: anywhere; }
      .narrative-line[data-kind="error"] { color: #e08a8a; }
      .narrative-line[data-kind="cost"] { color: #9aa7b1; font-family: ui-monospace, Consolas, monospace; }
      .approval-card {
        margin: 0 16px 8px; padding: 12px 14px; max-width: 860px; align-self: center; width: calc(100% - 32px);
        border: 1px solid #7a6530; border-radius: 10px; background: #1d1a12;
      }
      .approval-card[data-kind="plan"] { border-color: #34506e; background: #131a24; }
      .approval-title { font-weight: 600; margin-bottom: 6px; }
      .approval-message { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
      .approval-detail summary { cursor: pointer; margin-bottom: 6px; }
      .approval-detail pre { margin: 4px 0 8px; padding: 7px 9px; background: #0e1318; border-radius: 6px; max-height: 180px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .plan-body { margin: 4px 0 10px; padding: 9px 11px; background: #0e1318; border-radius: 6px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .approval-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .approval-actions button.secondary { border-color: #2f3944; color: #a7b2bc; }
      .approval-feedback { display: flex; flex-direction: column; gap: 8px; }
      .approval-feedback textarea {
        min-height: 64px; padding: 8px 10px; border-radius: 8px; resize: vertical;
        border: 1px solid #2a333c; background: #161c22; color: #d7dde3; font: inherit;
      }
      .completion { position: relative; }
      .composer { position: relative; }
      .completion {
        position: absolute; bottom: calc(100% + 6px); left: 16px; z-index: 5;
        display: flex; flex-direction: column; min-width: 380px; max-width: calc(100% - 32px);
        border: 1px solid #2a333c; border-radius: 8px; background: #161c22; overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
      }
      .completion-item { display: flex; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid #20272e; border-radius: 0; background: transparent; padding: 7px 12px; text-align: left; }
      .completion-item:last-child { border-bottom: 0; }
      .completion-item:hover { background: #1d2630; }
      .completion-item .muted { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .completion-kind { font-size: 11px; color: #77828c; border: 1px solid #2a333c; border-radius: 4px; padding: 1px 6px; }
      .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #232a31; }
      .composer input {
        flex: 1; padding: 9px 12px; border-radius: 8px;
        border: 1px solid #2a333c; background: #161c22; color: #d7dde3;
      }
      .composer input:disabled { opacity: .55; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
